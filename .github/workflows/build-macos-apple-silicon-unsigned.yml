name: Compilar macOS Apple Silicon nao assinado

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-macos-apple-silicon-unsigned.yml"
      - "scripts/build-macos.sh"
      - "scripts/test-macos-unsigned-installer.sh"

permissions:
  contents: write

jobs:
  build:
    name: Painel e instalador completo Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60

    env:
      MAC_ALLOW_UNSIGNED: "1"
      ADSPOWER_MAC_ARM64_URL: "https://version.adspower.net/software/darwin-arm64-global/8.6.3/AdsPower-Global-8.6.3-arm64.dmg"
      ADSPOWER_MAC_ARM64_SHA256: "c2cfb801bb1bd5ab95fa3a7319466479229a16a8a63ea929650b8773c0bf022d"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Confirmar arquitetura
        run: |
          test "$(uname -m)" = "arm64"
          node -p "require('./package.json').version" | grep -qx "2.0.6"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar inicializacao, cache e recuperacao de sessao
        run: |
          npm run test:startup
          npm run test:cache
          npm run test:session-recovery
          grep -q "platform === 'darwin' ? 'macos'" scripts/local-agent.js
          grep -q "with administrator privileges" scripts/local-agent.js

      - name: Compilar macOS Apple Silicon
        run: npm run build:mac:apple

      - name: Testar instalacao, assinatura interna e Gatekeeper
        env:
          EXPECTED_ARCH: arm64
          EXPECTED_VERSION: 2.0.6
          REPORT_SLUG: MAC-APPLE-SILICON
          REPORT_TITLE: Apple Silicon
        run: |
          chmod +x scripts/test-macos-unsigned-installer.sh
          scripts/test-macos-unsigned-installer.sh \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/NinjaFlixCompletoSetup-2.0.6-mac-arm64.pkg \
            ARQUIVOS-GERADOS/RELATORIOS/APPLE-SILICON-ADHOC
          cat ARQUIVOS-GERADOS/RELATORIOS/APPLE-SILICON-ADHOC/RELATORIO-TESTE-MAC-APPLE-SILICON-2.0.6-ADHOC.md >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar arquivos gerados
        run: |
          find ARQUIVOS-GERADOS -maxdepth 6 -type f -print
          du -sh ARQUIVOS-GERADOS

      - name: Disponibilizar arquivos para download temporario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-2.0.6-temp"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Build temporario 2.0.6" --notes "Arquivos de compilacao para publicacao na VPS." --prerelease || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            ARQUIVOS-GERADOS/1-ATUALIZACAO-PAINEL-PUBLICAR-NO-ADMIN/MAC/*-arm64.zip \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/*-arm64.pkg \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/*-arm64.txt \
            ARQUIVOS-GERADOS/RELATORIOS/APPLE-SILICON-ADHOC/*.md \
            --clobber

      - name: Anexar diagnosticos do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-apple-silicon-adhoc-2.0.6
          path: ARQUIVOS-GERADOS/RELATORIOS/APPLE-SILICON-ADHOC
          retention-days: 30
