name: Compilar Linux x64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-linux-x64.yml"
      - "scripts/build-linux.sh"
      - "electron/**"
      - "scripts/local-agent.js"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    name: Painel e instalador completo Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      ADSPOWER_LINUX_X64_URL: "https://version.adspower.net/software/linux-x64-global/8.6.3/AdsPower-Global-8.6.3-x64.deb"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Confirmar arquitetura e versao
        run: |
          test "$(uname -m)" = "x86_64"
          node -p "require('./package.json').version" | grep -qx "1.1.22"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar ferramentas Linux
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Compilar Linux x64
        run: npm run build:linux:x64

      - name: Mostrar e validar arquivos gerados
        run: |
          find ARQUIVOS-GERADOS -maxdepth 6 -type f -print
          file ARQUIVOS-GERADOS/1-ATUALIZACAO-PAINEL-PUBLICAR-NO-ADMIN/LINUX/NinjaFlixPainelUpdate-1.1.22-linux-x64.AppImage
          tar -tzf ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/LINUX/NinjaFlixCompletoSetup-1.1.22-linux-x64.tar.gz

      - name: Preparar partes do instalador completo
        run: |
          mkdir -p "$RUNNER_TEMP/ninjaflix-linux-parts"
          split -b 180m \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/LINUX/NinjaFlixCompletoSetup-1.1.22-linux-x64.tar.gz \
            "$RUNNER_TEMP/ninjaflix-linux-parts/NinjaFlixCompletoSetup-1.1.22-linux-x64.tar.gz.part-"
          test -f "$RUNNER_TEMP/ninjaflix-linux-parts/NinjaFlixCompletoSetup-1.1.22-linux-x64.tar.gz.part-aa"

      - name: Disponibilizar atualizacao e checksum
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-Linux-x64-1.1.22-update-${{ github.run_number }}
          path: |
            ARQUIVOS-GERADOS/1-ATUALIZACAO-PAINEL-PUBLICAR-NO-ADMIN/LINUX/*.AppImage
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/LINUX/*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar instalador parte AA
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-Linux-x64-1.1.22-completo-part-aa-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-linux-parts/*.part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar instalador parte AB
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-Linux-x64-1.1.22-completo-part-ab-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-linux-parts/*.part-ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar instalador parte AC
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-Linux-x64-1.1.22-completo-part-ac-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-linux-parts/*.part-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar instalador parte AD
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-Linux-x64-1.1.22-completo-part-ad-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-linux-parts/*.part-ad
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
