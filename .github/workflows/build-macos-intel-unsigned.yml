name: Compilar macOS Intel nao assinado

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-macos-intel-unsigned.yml"
      - "scripts/build-macos.sh"
      - "scripts/test-macos-unsigned-installer.sh"

permissions:
  contents: write

jobs:
  build:
    name: Painel e instalador completo Intel
    runs-on: macos-15-intel
    timeout-minutes: 60

    env:
      MAC_ALLOW_UNSIGNED: "1"
      ADSPOWER_MAC_X64_URL: "https://version.adspower.net/software/darwin-global/8.6.3/AdsPower-Global-8.6.3.dmg"
      ADSPOWER_MAC_X64_SHA256: "6f30427000ba4f9a1713823008039bece87717bb5d2f6267722a374521a722fe"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Confirmar arquitetura e versao
        run: |
          test "$(uname -m)" = "x86_64"
          node -p "require('./package.json').version" | grep -qx "2.0.1"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar macOS Intel
        run: npm run build:mac:intel

      - name: Testar instalacao, assinatura interna e Gatekeeper
        env:
          EXPECTED_ARCH: x86_64
          EXPECTED_VERSION: 2.0.1
          REPORT_SLUG: MAC-INTEL
          REPORT_TITLE: macOS Intel
        run: |
          chmod +x scripts/test-macos-unsigned-installer.sh
          scripts/test-macos-unsigned-installer.sh \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg \
            ARQUIVOS-GERADOS/RELATORIOS/MAC-INTEL-ADHOC
          cat ARQUIVOS-GERADOS/RELATORIOS/MAC-INTEL-ADHOC/RELATORIO-TESTE-MAC-INTEL-2.0.1-ADHOC.md >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar arquivos gerados
        run: |
          find ARQUIVOS-GERADOS -maxdepth 6 -type f -print
          du -sh ARQUIVOS-GERADOS

      - name: Disponibilizar arquivos para download temporario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-2.0.1-temp"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Build temporario 2.0.1" --notes "Arquivos de compilacao para publicacao na VPS." --prerelease || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            ARQUIVOS-GERADOS/1-ATUALIZACAO-PAINEL-PUBLICAR-NO-ADMIN/MAC/*-x64.zip \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/*-x64.pkg \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/*-x64.txt \
            ARQUIVOS-GERADOS/RELATORIOS/MAC-INTEL-ADHOC/*.md \
            --clobber

      - name: Anexar diagnosticos do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-mac-intel-adhoc-2.0.1
          path: ARQUIVOS-GERADOS/RELATORIOS/MAC-INTEL-ADHOC
          retention-days: 30
