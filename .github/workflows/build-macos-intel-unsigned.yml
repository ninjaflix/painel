name: Compilar macOS Intel nao assinado

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-macos-intel-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Painel e instalador completo Intel
    runs-on: macos-15-intel
    timeout-minutes: 60

    env:
      MAC_ALLOW_UNSIGNED: "1"
      ADSPOWER_MAC_X64_URL: "https://version.adspower.net/software/darwin-global/8.6.3/AdsPower-Global-8.6.3.dmg"
      ADSPOWER_MAC_X64_SHA256: "6f30427000ba4f9a1713823008039bece87717bb5d2f6267722a374521a722fe"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Confirmar arquitetura e versao
        run: |
          test "$(uname -m)" = "x86_64"
          node -p "require('./package.json').version" | grep -qx "2.0.1"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar macOS Intel
        run: npm run build:mac:intel

      - name: Mostrar arquivos gerados
        run: |
          find ARQUIVOS-GERADOS -maxdepth 6 -type f -print
          du -sh ARQUIVOS-GERADOS

      - name: Preparar partes do instalador completo
        run: |
          mkdir -p "$RUNNER_TEMP/ninjaflix-intel-parts"
          split -b 240m \
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg \
            "$RUNNER_TEMP/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-"
          test -f "$RUNNER_TEMP/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-aa"
          test -f "$RUNNER_TEMP/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-ab"
          test -f "$RUNNER_TEMP/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-ac"
          test ! -f "$RUNNER_TEMP/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-ad"

      - name: Disponibilizar atualizacao e checksum
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-macOS-Intel-2.0.1-update-${{ github.run_number }}
          path: |
            ARQUIVOS-GERADOS/1-ATUALIZACAO-PAINEL-PUBLICAR-NO-ADMIN/MAC/*-x64.zip
            ARQUIVOS-GERADOS/2-INSTALACAO-COMPLETA-NOVOS-CLIENTES/MAC/*-x64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar PKG parte AA
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-macOS-Intel-2.0.1-pkg-part-aa-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar PKG parte AB
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-macOS-Intel-2.0.1-pkg-part-ab-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-ab
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Disponibilizar PKG parte AC
        uses: actions/upload-artifact@v4
        with:
          name: NinjaFlix-macOS-Intel-2.0.1-pkg-part-ac-${{ github.run_number }}
          path: ${{ runner.temp }}/ninjaflix-intel-parts/NinjaFlixCompletoSetup-2.0.1-mac-x64.pkg.part-ac
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
